<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Melody Music Player - A modern, feature-rich web music player">
    <title>🎵 Melody Music Player</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-animation"></div>

    <div class="container">

        <header class="header">

            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Melody</h1>
            </div>

            <p class="tagline">Your Personal Music Studio</p>
            <button
                class="theme-toggle"
                id="themeToggle"
                aria-label="Switch to light theme">
                <i class="fas fa-moon"></i>
            </button>

        </header>

        <main class="main-content">
            <section class="player-card">

                <!-- Album Art -->
                <div class="album-art-container">

                    <div class="album-art-wrapper">

                        <img
                            src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=500&fit=crop"
                            alt="Album Cover"
                            id="albumArt"
                            class="album-art">

                        <div class="vinyl-effect"></div>

                    </div>
                    <div class="equalizer" id="equalizer">

                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>

                    </div>

                </div>
                <div class="song-info">

                    <h2 class="song-title" id="songTitle">
                        Summer Vibes
                    </h2>

                    <p class="song-artist" id="songArtist">
                        Chill Beats
                    </p>

                    <button
                        class="favorite-btn"
                        id="favoriteBtn"
                        aria-label="Add to favorites">

                        <i class="far fa-heart"></i>

                    </button>

                </div>
                <div class="progress-container">

                    <span
                        class="current-time"
                        id="currentTime">
                        0:00
                    </span>

                    <div class="progress-bar-wrapper">

                        <input
                            type="range"
                            id="progressBar"
                            class="progress-bar"
                            min="0"
                            max="100"
                            value="0"
                            aria-label="Seek music">

                        <div
                            class="progress-fill"
                            id="progressFill">
                        </div>

                    </div>

                    <span
                        class="total-time"
                        id="totalTime">
                        0:00
                    </span>

                </div>
                <div class="player-controls">
                    <button
                        class="control-btn"
                        id="shuffleBtn"
                        aria-label="Shuffle">

                        <i class="fas fa-random"></i>

                    </button>
                    <button
                        class="control-btn"
                        id="prevBtn"
                        aria-label="Previous song">

                        <i class="fas fa-step-backward"></i>

                    </button>
                    <button
                        class="play-btn"
                        id="playBtn"
                        aria-label="Play">

                        <i
                            class="fas fa-play"
                            id="playIcon">
                        </i>

                    </button>
                    <button
                        class="control-btn"
                        id="nextBtn"
                        aria-label="Next song">

                        <i class="fas fa-step-forward"></i>

                    </button>
                    <button
                        class="control-btn"
                        id="repeatBtn"
                        aria-label="Repeat">

                        <i class="fas fa-redo"></i>

                    </button>

                </div>
                <div class="volume-control">

                    <button
                        class="volume-btn"
                        id="volumeIcon"
                        aria-label="Mute">

                        <i class="fas fa-volume-up"></i>

                    </button>

                    <div class="volume-slider-wrapper">

                        <input
                            type="range"
                            id="volumeSlider"
                            class="volume-slider"
                            min="0"
                            max="100"
                            value="70"
                            aria-label="Volume">

                        <div
                            class="volume-fill"
                            id="volumeFill">
                        </div>

                    </div>

                    <span
                        class="volume-percentage"
                        id="volumePercentage">
                        70%
                    </span>

                </div>

            </section>


            <div class="right-content">
            <section class="playlist-section">
                <div class="playlist-header">

                    <h3>
                        <i class="fas fa-list-ul"></i>
                        Playlist
                    </h3>

                    <span
                        class="playlist-count"
                        id="playlistCount">
                        5 songs
                    </span>

                </div>
                <div class="search-container">

                    <i class="fas fa-search search-icon"></i>

                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search songs or artists...">

                </div>
                <div
                    class="playlist"
                    id="playlist">
                </div>

            </section>

<section class="recently-played-section">

    <div class="recently-played-header">

        <h3>
            <i class="fas fa-history"></i>
            Recently Played
        </h3>

        <button
            class="clear-recent-btn"
            id="clearRecentBtn">
            <i class="fas fa-trash"></i>
            Clear
        </button>

    </div>

    <div
        class="recently-played"
        id="recentlyPlayed">

        <div class="no-recently-played">
            <i class="fas fa-clock"></i>
            <p>No recently played songs</p>
        </div>

    </div>

</section>

            </div>

        </main>

    </div>
    <div
        class="toast"
        id="toast">

        <i class="fas fa-music"></i>

        <span id="toastMessage">
            Now Playing
        </span>

    </div>

    <audio
        id="audioPlayer"
        preload="metadata">
    </audio>

    <script src="script.js"></script>

</body>
</html>
